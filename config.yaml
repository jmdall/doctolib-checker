run_in_loop: false
interval_in_seconds: 60

alive_check: true
hour_of_alive_check: 15

# Legacy default dates (used as fallback if not defined per doctor)
limit_date: "2024-01-01"
start_date: "2024-01-01"

# Configure one or more doctors
# IMPORTANT: each URL must include:
#   start_date=%(start_date)s&limit=%(limit)s
doctors:
  - name: "Dr Martin"
    start_date: "2024-01-01"
    limit_date: "2024-01-31"
    url: "url_for_dr_martin_with_start_date=%(start_date)s&limit=%(limit)s"

  - name: "Dr Dupont"
    start_date: "2024-01-05"
    limit_date: "2024-02-01"
    url: "url_for_dr_dupont_with_start_date=%(start_date)s&limit=%(limit)s"

# Legacy URL format kept for backward compatibility when doctors is empty
url: "url (see README.md)"

pushover_credentials:
  api_token: "token"
  user_key: "key"
